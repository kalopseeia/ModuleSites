<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ModuleSites</title>

    <style>
        :root {
            --bg: #0b1020;
            --card: #121a2f;
            --card-hover: #18233e;
            --text: #f8fafc;
            --muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #818cf8;
            --border: rgba(255, 255, 255, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: var(--text);

            background:
                radial-gradient(circle at top left,
                    #1e1b4b 0,
                    transparent 35%),
                radial-gradient(circle at bottom right,
                    #172554 0,
                    transparent 35%),
                var(--bg);
        }

        header {
            padding: 55px 20px 35px;
            text-align: center;
        }

        header h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        header p {
            margin-top: 10px;
            color: var(--muted);
            font-size: 1rem;
        }

        .container {
            width: min(1200px, calc(100% - 32px));
            margin: auto;
            padding-bottom: 60px;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .modules {
            display: grid;
            grid-template-columns:
                repeat(auto-fit, minmax(320px, 1fr));

            gap: 24px;
        }

        .module {
            overflow: hidden;

            background: rgba(18, 26, 47, 0.9);

            border: 1px solid var(--border);
            border-radius: 20px;

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(12px);

            transition:
                transform 0.2s ease,
                border-color 0.2s ease;
        }

        .module:hover {
            transform: translateY(-4px);

            border-color:
                rgba(129, 140, 248, 0.4);
        }

        .module-header {
            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 18px 20px;

            border-bottom:
                1px solid var(--border);
        }

        .module-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .number {
            display: grid;
            place-items: center;

            width: 40px;
            height: 40px;

            border-radius: 12px;

            background: var(--accent);

            font-weight: 800;
        }

        .module-title h2 {
            font-size: 1.1rem;
        }

        .status {
            color: var(--muted);
            font-size: 0.75rem;
        }

        .preview {
            position: relative;
            height: 300px;
            background: white;
        }

        iframe {
            display: block;

            width: 100%;
            height: 100%;

            border: 0;

            background: white;
        }

        .loading-preview {
            position: absolute;

            inset: 0;

            display: grid;
            place-items: center;

            color: #475569;
            background: #f8fafc;

            z-index: 1;

            pointer-events: none;
        }

        .loading-preview.hidden {
            display: none;
        }

        .error {
            display: none;

            position: absolute;
            inset: 0;

            place-items: center;

            padding: 30px;

            text-align: center;

            color: #475569;

            background: #f8fafc;

            z-index: 2;
        }

        .error.show {
            display: grid;
        }

        .error strong {
            display: block;

            margin-bottom: 8px;

            color: #0f172a;
        }

        .actions {
            display: flex;
            gap: 10px;

            padding: 16px 20px 20px;
        }

        .button {
            flex: 1;

            display: inline-flex;
            align-items: center;
            justify-content: center;

            min-height: 42px;

            padding: 10px 16px;

            border-radius: 10px;

            border: 1px solid var(--border);

            color: var(--text);

            background:
                rgba(255, 255, 255, 0.05);

            text-decoration: none;

            font-size: 0.9rem;
            font-weight: 600;

            cursor: pointer;

            transition:
                background 0.2s ease;
        }

        .button:hover {
            background: var(--card-hover);
        }

        .button.primary {
            background: var(--accent);

            border-color: transparent;
        }

        .button.primary:hover {
            background: var(--accent-hover);
        }

        .empty {
            padding: 60px 20px;

            text-align: center;

            color: var(--muted);
        }

        footer {
            padding: 30px 20px;

            text-align: center;

            color: var(--muted);

            font-size: 0.8rem;
        }

        @media (max-width: 600px) {
            header {
                padding-top: 35px;
            }

            .container {
                width: calc(100% - 20px);
            }

            .modules {
                grid-template-columns: 1fr;
            }

            .preview {
                height: 260px;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>ModuleSites</h1>
        <p>All modules and projects</p>
    </header>

    <main class="container">

        <div id="loading" class="loading">
            Discovering modules...
        </div>

        <section id="modules" class="modules">
        </section>

        <div id="empty" class="empty" style="display:none;">
            No modules found.
        </div>

    </main>

    <footer>
        Automatically generated from the repository
    </footer>


    <script>

        /*
         * GitHub repository
         */
        const OWNER = "kalopseeia";
        const REPO = "ModuleSites";


        /*
         * GitHub API endpoint
         *
         * This gets everything in the repository root.
         */
        const API_URL =
            `https://api.github.com/repos/${OWNER}/${REPO}/contents/`;


        const modulesContainer =
            document.getElementById("modules");

        const loading =
            document.getElementById("loading");

        const empty =
            document.getElementById("empty");


        /*
         * Create a module card
         */
        function createModule(folder) {

            const moduleName =
                folder.name;

            const modulePath =
                `${moduleName}/index.html`;


            const article =
                document.createElement("article");

            article.className = "module";


            article.innerHTML = `

        <div class="module-header">

          <div class="module-title">

            <div class="number">
              ${escapeHTML(moduleName)}
            </div>

            <h2>
              Module ${escapeHTML(moduleName)}
            </h2>

          </div>

          <span class="status">
            index.html
          </span>

        </div>


        <div class="preview">

          <div class="loading-preview">
            Loading preview...
          </div>

          <div class="error">

            <div>

              <strong>
                Unable to load this module.
              </strong>

              <span>
                Make sure
                <code>${escapeHTML(modulePath)}</code>
                exists.
              </span>

            </div>

          </div>


          <iframe
            src="${escapeAttribute(modulePath)}"
            title="Module ${escapeAttribute(moduleName)}"
            loading="lazy">
          </iframe>

        </div>


        <div class="actions">

          <a
            class="button primary"
            href="${escapeAttribute(modulePath)}"
            target="_blank"
            rel="noopener">
            Open Module
          </a>


          <button class="button fullscreen">
            Fullscreen
          </button>

        </div>

      `;


            const iframe =
                article.querySelector("iframe");

            const preview =
                article.querySelector(".preview");

            const previewLoading =
                article.querySelector(".loading-preview");

            const error =
                article.querySelector(".error");

            const fullscreen =
                article.querySelector(".fullscreen");


            iframe.addEventListener("load", () => {

                previewLoading.classList.add(
                    "hidden"
                );

            });


            iframe.addEventListener("error", () => {

                previewLoading.classList.add(
                    "hidden"
                );

                error.classList.add(
                    "show"
                );

            });


            fullscreen.addEventListener("click", () => {

                if (preview.requestFullscreen) {

                    preview.requestFullscreen();

                }

            });


            return article;

        }


        /*
         * Escape HTML
         */
        function escapeHTML(value) {

            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");

        }


        /*
         * Escape attribute values
         */
        function escapeAttribute(value) {

            return escapeHTML(value);

        }


        /*
         * Discover modules
         */
        async function discoverModules() {

            try {

                const response =
                    await fetch(API_URL);


                if (!response.ok) {

                    throw new Error(
                        `GitHub API error: ${response.status}`
                    );

                }


                const files =
                    await response.json();


                /*
                 * Find directories only.
                 *
                 * This means:
                 *
                 * 1/
                 * 2/
                 * 3/
                 * 4/
                 *
                 * will automatically be detected.
                 *
                 * Files such as README.md and
                 * index.html are ignored.
                 */
                let folders =
                    files.filter(
                        item => item.type === "dir"
                    );


                /*
                 * Only use folders that contain
                 * a valid index.html.
                 */
                const validModules = [];


                for (const folder of folders) {

                    try {

                        const indexURL =
                            `https://api.github.com/repos/` +
                            `${OWNER}/${REPO}/contents/` +
                            `${folder.name}/index.html`;


                        const indexResponse =
                            await fetch(indexURL);


                        if (indexResponse.ok) {

                            validModules.push(folder);

                        }

                    } catch (error) {

                        console.warn(
                            `Could not check ${folder.name}`,
                            error
                        );

                    }

                }


                /*
                 * Sort numerically when folders are
                 * named 1, 2, 3, 4...
                 */
                validModules.sort((a, b) => {

                    const aNumber =
                        Number(a.name);

                    const bNumber =
                        Number(b.name);


                    if (
                        !Number.isNaN(aNumber) &&
                        !Number.isNaN(bNumber)
                    ) {

                        return aNumber - bNumber;

                    }


                    return a.name.localeCompare(
                        b.name
                    );

                });


                loading.style.display =
                    "none";


                /*
                 * No modules
                 */
                if (validModules.length === 0) {

                    empty.style.display =
                        "block";

                    return;

                }


                /*
                 * Render modules
                 */
                validModules.forEach(folder => {

                    modulesContainer.appendChild(
                        createModule(folder)
                    );

                });


            } catch (error) {

                console.error(error);


                loading.innerHTML = `
          <p>
            Unable to load modules.
          </p>

          <p style="
            margin-top:10px;
            font-size:0.8rem;
          ">
            ${escapeHTML(error.message)}
          </p>
        `;

            }

        }


        /*
         * Start
         */
        discoverModules();

    </script>

</body>

</html>
